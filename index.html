const $=id=>document.getElementById(id);
let tab='recent', query='', current=null, shift=0, fontSize=16;
function loadFavs(){try{return new Set(JSON.parse(localStorage.getItem('maestro-favs')||'[]'))}catch(e){return new Set()}}
const favs=loadFavs();
function saveFavs(){try{localStorage.setItem('maestro-favs',JSON.stringify([...favs]))}catch(e){}}
function cleanTitle(s){return s.replace(/\s+/g,' ').trim()}
function normTitle(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){let p=Array.from({length:b.length+1},(_,i)=>i),c=[];for(let i=1;i<=a.length;i++){c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function rank(title,q){const t=normTitle(title),n=normTitle(q);if(!n)return 0;if(t===n)return 0;if(t.startsWith(n))return 10;if(t.includes(n))return 20;let pen=0;for(const w of n.split(' ')){let best=99;for(const z of t.split(' '))best=Math.min(best,lev(w,z));const allow=w.length<=3?0:w.length<=6?1:2;if(best>allow)return null;pen+=best}return 30+pen}
function filtered(){let a=query?SONGS.map((s,i)=>({s,i,r:rank(s.title,query)})).filter(x=>x.r!==null).sort((a,b)=>a.r-b.r||a.s.title.localeCompare(b.s.title)).map(x=>x.s):SONGS.slice();if(tab==='fav')a=a.filter(s=>favs.has(s.id));if(tab==='recent'&&!query)a=a.slice(-12).reverse();else if(!query)a.sort((x,y)=>x.title.localeCompare(y.title));return a}
function renderList(){const arr=filtered();$('listTitle').textContent=tab==='recent'?'Recently added':tab==='fav'?'Favourites':'All songs';$('count').textContent=query?arr.length+' found':SONGS.length+' songs';$('songlist').innerHTML='';if(!arr.length){$('songlist').innerHTML='<div class="empty">No songs found.</div>';return}for(const s of arr){const b=document.createElement('button');b.className='song';b.innerHTML='<span class="note">♫</span><span class="meta"><strong></strong><small></small></span><span class="arrow">›</span>';b.querySelector('strong').textContent=s.title;b.querySelector('small').textContent=s.artist||'Unknown artist';b.addEventListener('click',()=>openSong(s));$('songlist').appendChild(b)}}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderList()}
function loadFont(){try{return Number(localStorage.getItem('maestro-font'))||17}catch(e){return 17}}
function saveFont(){try{localStorage.setItem('maestro-font',fontSize)}catch(e){}}
let listScroll=0;
function toTop(y){const go=()=>{window.scrollTo(0,y);if(document.scrollingElement)document.scrollingElement.scrollTop=y;document.body.scrollTop=y};go();requestAnimationFrame(go);setTimeout(go,60)}
function openSong(s){listScroll=window.scrollY||(document.scrollingElement&&document.scrollingElement.scrollTop)||0;current=s;shift=0;fontSize=loadFont();$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('songTitle').textContent=s.title;$('songArtist').textContent=s.artist;updateKey();$('lyrics').style.fontSize=fontSize+'px';$('favourite').textContent=favs.has(s.id)?'♥':'♡';renderLyrics();toTop(0)}
function back(){current=null;$('detail').classList.add('hidden');$('home').classList.remove('hidden');renderList();toTop(listScroll)}
const LET='CDEFGAB',LPC=[0,2,4,5,7,9,11];
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const MAJ_NAME=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MIN_NAME=['Cm','C#m','Dm','Ebm','Em','Fm','F#m','Gm','G#m','Am','Bbm','Bm'];
function npc(n){const i=LET.indexOf(n[0]);if(i<0)return null;let p=LPC[i];for(const a of n.slice(1)){if(a==='#')p++;else if(a==='b')p--}return(p+12)%12}
// SongbookPro key codes: 0=A,1=Bb,...,11=Ab (major); 12+ = relative minor of (code-12)
function songKey(){const k=Number(current&&current.key)||0;const minor=k>=12;const majPc=((k%12)+9)%12;return{minor,pc:minor?(majPc+9)%12:majPc}}
function keyName(pc,minor){return minor?MIN_NAME[pc]:MAJ_NAME[pc]}
function tonicOf(pc,minor){return keyName(pc,minor).replace(/m$/,'')}
function flatMode(pc,minor){const maj=minor?(pc+3)%12:pc;return[1,3,5,8,10].includes(maj)}
function spellNote(n,amt){const p=npc(n);if(p===null||amt===0)return n;const k=songKey();const t0=tonicOf(k.pc,k.minor),tp=(k.pc+amt)%12,t1=tonicOf(tp,k.minor);
 const ls=(LET.indexOf(t1[0])-LET.indexOf(t0[0])+7)%7;const nl=LET[(LET.indexOf(n[0])+ls)%7];const np=(p+amt)%12;let acc=((np-LPC[LET.indexOf(nl)])%12+12)%12;if(acc>6)acc-=12;
 if(Math.abs(acc)<=1){const r=nl+(acc===1?'#':acc===-1?'b':'');const odd={'B#':'C','E#':'F','Cb':'B','Fb':'E'};return odd[r]||r}
 return(flatMode(tp,k.minor)?FL:SH)[np]}
function transposeChord(ch,amt){amt=((amt%12)+12)%12;if(!amt)return ch;const m=ch.match(/^([A-G][#b]?)(.*)$/);if(!m)return ch;const tail=m[2].replace(/\/([A-G][#b]?)/g,(a,b)=>'/'+spellNote(b,amt));return spellNote(m[1],amt)+tail}

function splitLine(raw){const a=raw.split(/\[([^\]]*)\]/);const parts=[];if(a[0])parts.push({c:null,t:a[0]});for(let i=1;i<a.length;i+=2)parts.push({c:a[i],t:a[i+1]||''});return parts}

function renderChart(host,content,amt){host.innerHTML='';
 for(const raw of (content||'').split(/\r?\n/)){
  const sec=raw.match(/^\s*\{(?:c|comment):\s*(.*?)\s*\}\s*$/i);
  if(sec){const d=document.createElement('div');d.className='section-label';d.textContent=sec[1];host.appendChild(d);continue}
  if(/^\s*\{.*\}\s*$/.test(raw))continue;
  if(!raw.trim()){const d=document.createElement('div');d.className='gap';host.appendChild(d);continue}
  const parts=splitLine(raw);const hasChord=parts.some(p=>p.c!==null);
  if(!hasChord){const d=document.createElement('div');d.className='tx';d.textContent=raw;host.appendChild(d);continue}
  const hasLyric=parts.some(p=>p.t.trim());
  if(!hasLyric){const d=document.createElement('div');d.className='co';const cs=parts.filter(p=>p.c!==null);let out='';
   cs.forEach((p,i)=>{out+=transposeChord(p.c,amt)+(i<cs.length-1?' '.repeat(Math.max(3,p.t.length)):'')});
   d.textContent=out;host.appendChild(d);continue}
  const line=document.createElement('div');line.className='pl';
  const add=(c,t)=>{const g=document.createElement('span');g.className='sg';const ce=document.createElement('span');ce.className='c';ce.textContent=c||'';const le=document.createElement('span');le.className='l';le.textContent=t||'\u00a0';g.append(ce,le);line.appendChild(g)};
  for(const p of parts){
   const words=p.t.match(/\S+\s*|\s+/g)||[''];
   words.forEach((w,i)=>add(i===0&&p.c!==null?transposeChord(p.c,amt):'',w));
  }
  host.appendChild(line)}}
$('search').addEventListener('input',e=>{query=e.target.value;if(query&&tab==='recent')setTab('all');else renderList();syncClear()});const clearSearch=$('clearSearch');function syncClear(){clearSearch.classList.toggle('show',$('search').value.length>0)}clearSearch.onclick=()=>{$('search').value='';query='';syncClear();renderList();$('search').focus()};document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('allTile').onclick=()=>setTab('all');$('favTile').onclick=()=>setTab('fav');$('back').onclick=back;
$('down').onclick=()=>{shift=(shift+11)%12;updateKey();renderLyrics()};$('up').onclick=()=>{shift=(shift+1)%12;updateKey();renderLyrics()};$('shift').onclick=()=>{shift=0;updateKey();renderLyrics()};$('smaller').onclick=()=>{fontSize=Math.max(14,fontSize-1);saveFont();$('lyrics').style.fontSize=fontSize+'px'};$('larger').onclick=()=>{fontSize=Math.min(28,fontSize+1);saveFont();$('lyrics').style.fontSize=fontSize+'px'};$('favourite').onclick=()=>{if(favs.has(current.id))favs.delete(current.id);else favs.add(current.id);saveFavs();$('favourite').textContent=favs.has(current.id)?'♥':'♡';renderList()};
